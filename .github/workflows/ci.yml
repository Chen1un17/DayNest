name: macOS checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Test models and persistence
        run: ./scripts/test.sh
      - name: Build application
        run: ./scripts/build-app.sh
      - name: Verify signature
        run: codesign --verify --deep --strict dist/DayNest.app
